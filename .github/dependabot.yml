version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      zxing:
        patterns:
          - '@zxing/*'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
    ignore:
      - dependency-name: eslint
        versions: ['>=10']
      - dependency-name: typescript
        versions: ['>=6.1']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
